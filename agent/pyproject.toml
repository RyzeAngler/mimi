[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimi-agent"
version = "0.1.0"
description = "Mimi desktop AI pet Agent and streaming speech service"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: calls the live Volcengine TTS API using local credentials",
]

[tool.setuptools.packages.find]
where = ["src"]
